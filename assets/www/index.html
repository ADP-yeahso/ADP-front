<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Garden 3D</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #93cc6b url('background/floor.png') center / cover no-repeat;
    }
    /* 모든 PNG는 852 × 852의 같은 캔버스이므로 동일한 크기와 기준점으로 겹친다.
       앞에서부터 땅 → 산 → 물 → 구름 → 하늘 순서다. */
    #garden-background {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 60%;
      pointer-events: none;
      background-image:
        url('background/land.png'),
        url('background/mountains.png'),
        url('background/water.png'),
        url('background/clouds.png'),
        url('background/sky.png');
      background-position: center;
      background-size: max(calc(100vw + 96px), calc(60vh + 96px));
      background-repeat: no-repeat;
    }
    #canvas-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: block;
    }
    #canvas-container canvas {
      display: block;
    }
    /* Simple loading text if needed */
    #loading {
      position: absolute;
      z-index: 1;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-family: sans-serif;
      color: #888;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="garden-background" aria-hidden="true"></div>
  <div id="loading">정원을 가꾸는 중...</div>
  <div id="canvas-container"></div>

  <!-- Import maps polyfill -->
  <script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
  
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>

  <!-- GSAP for Tweening -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

  <script type="module" src="main.js"></script>
</body>
</html>
