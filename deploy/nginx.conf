server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Keep browser API requests on this origin and proxy them to the backend.
  location /api/ {
    proxy_pass https://adp-back-production.up.railway.app;
    proxy_ssl_server_name on;
    proxy_set_header Host adp-back-production.up.railway.app;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Flutter 웹 라우트를 새로고침해도 앱 진입점으로 돌려보냅니다.
  location / {
    try_files $uri $uri/ /index.html;
  }

  location = /health {
    add_header Content-Type text/plain;
    return 200 'ok';
  }
}
