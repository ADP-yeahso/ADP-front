<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Notebook Outline -->
  <rect x="25" y="10" width="60" height="80" rx="8" fill="none" stroke="currentColor" stroke-width="8" stroke-linejoin="round"/>
  
  <!-- Spirals -->
  <!-- Spiral 1 -->
  <line x1="10" y1="20" x2="30" y2="20" stroke="currentColor" stroke-width="8" stroke-linecap="round"/>
  <circle cx="30" cy="20" r="6" fill="currentColor"/>
  
  <!-- Spiral 2 -->
  <line x1="10" y1="35" x2="30" y2="35" stroke="currentColor" stroke-width="8" stroke-linecap="round"/>
  <circle cx="30" cy="35" r="6" fill="currentColor"/>

  <!-- Spiral 3 -->
  <line x1="10" y1="50" x2="30" y2="50" stroke="currentColor" stroke-width="8" stroke-linecap="round"/>
  <circle cx="30" cy="50" r="6" fill="currentColor"/>
  
  <!-- Spiral 4 -->
  <line x1="10" y1="65" x2="30" y2="65" stroke="currentColor" stroke-width="8" stroke-linecap="round"/>
  <circle cx="30" cy="65" r="6" fill="currentColor"/>
  
  <!-- Spiral 5 -->
  <line x1="10" y1="80" x2="30" y2="80" stroke="currentColor" stroke-width="8" stroke-linecap="round"/>
  <circle cx="30" cy="80" r="6" fill="currentColor"/>
</svg>
